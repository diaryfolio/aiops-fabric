  template:
    metadata:
      labels: {app.kubernetes.io/name: ingestion, viewsense.io/plane: ingestion}
    spec:
      serviceAccountName: ingestion
      automountServiceAccountToken: false
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ingestion
          image: viewsense-core:dev
          imagePullPolicy: Never
          ports: [{name: https, containerPort: 8443}]
          env:
            - {name: VS_APP_MODULE, value: viewsense_ingestion.app}
            - {name: VS_PORT, value: "8443"}
            - {name: VS_IDENTITY_URL, value: "https://identity:8443"}
            - {name: VS_IDENTITY_ISSUER, value: "https://identity:8443"}
            - {name: VS_IDENTITY_PUBLIC_KEY_FILE, value: /run/viewsense/identity/signing.pub}
            - {name: VS_TLS_CA_FILE, value: /run/viewsense/tls/ca.crt}
            - {name: VS_TLS_CERT_FILE, value: /run/viewsense/tls/tls.crt}
            - {name: VS_TLS_KEY_FILE, value: /run/viewsense/tls/tls.key}
            - {name: VS_CLIENT_ID, value: ingestion}
            - {name: VS_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: workload-credentials, key: ingestion}}}
            - {name: VS_MEMORY_URL, value: "https://memory-gateway:8443"}
          volumeMounts:
            - {name: tls, mountPath: /run/viewsense/tls, readOnly: true}
            - {name: identity-public, mountPath: /run/viewsense/identity, readOnly: true}
          readinessProbe: {tcpSocket: {port: https}, initialDelaySeconds: 2, periodSeconds: 3}
          livenessProbe: {tcpSocket: {port: https}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
      volumes:
        - {name: tls, secret: {secretName: tls-ingestion, defaultMode: 0444}}
        - {name: identity-public, secret: {secretName: identity-public, defaultMode: 0444}}
