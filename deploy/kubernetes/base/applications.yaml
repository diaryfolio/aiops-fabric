apiVersion: v1
kind: Service
metadata: {name: identity}
spec:
  selector: {app.kubernetes.io/name: identity}
  ports: [{name: https, port: 8443, targetPort: https}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: identity}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: identity}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: identity, viewsense.io/plane: security}
    spec:
      serviceAccountName: identity
      automountServiceAccountToken: false
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: identity
          image: viewsense-core:dev
          imagePullPolicy: Never
          ports: [{name: https, containerPort: 8443}]
          env:
            - {name: VS_APP_MODULE, value: viewsense_identity.app}
            - {name: VS_PORT, value: "8443"}
            - {name: VS_IDENTITY_ISSUER, value: "https://identity:8443"}
            - {name: VS_IDENTITY_PRIVATE_KEY_FILE, value: /run/viewsense/identity/signing.key}
            - {name: VS_IDENTITY_CLIENTS_FILE, value: /run/viewsense/identity/clients.json}
            - {name: VS_TLS_CA_FILE, value: /run/viewsense/tls/ca.crt}
            - {name: VS_TLS_CERT_FILE, value: /run/viewsense/tls/tls.crt}
            - {name: VS_TLS_KEY_FILE, value: /run/viewsense/tls/tls.key}
          volumeMounts:
            - {name: tls, mountPath: /run/viewsense/tls, readOnly: true}
            - {name: identity-material, mountPath: /run/viewsense/identity, readOnly: true}
          readinessProbe: {tcpSocket: {port: https}, initialDelaySeconds: 2, periodSeconds: 3}
          livenessProbe: {tcpSocket: {port: https}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
      volumes:
        - {name: tls, secret: {secretName: tls-identity, defaultMode: 0444}}
        - {name: identity-material, secret: {secretName: identity-material, defaultMode: 0444}}
---
apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  selector: {app.kubernetes.io/name: gateway}
  ports: [{name: https, port: 8443, targetPort: https}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: gateway}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway, viewsense.io/plane: edge}
    spec:
      serviceAccountName: gateway
      automountServiceAccountToken: false
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: viewsense-core:dev
          imagePullPolicy: Never
          ports: [{name: https, containerPort: 8443}]
          env: &gateway-env
            - {name: VS_APP_MODULE, value: viewsense_gateway.app}
            - {name: VS_PORT, value: "8443"}
            - {name: VS_IDENTITY_URL, value: "https://identity:8443"}
            - {name: VS_IDENTITY_ISSUER, value: "https://identity:8443"}
            - {name: VS_IDENTITY_PUBLIC_KEY_FILE, value: /run/viewsense/identity/signing.pub}
            - {name: VS_TLS_CA_FILE, value: /run/viewsense/tls/ca.crt}
            - {name: VS_TLS_CERT_FILE, value: /run/viewsense/tls/tls.crt}
            - {name: VS_TLS_KEY_FILE, value: /run/viewsense/tls/tls.key}
            - {name: VS_CLIENT_ID, value: gateway}
            - {name: VS_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: workload-credentials, key: gateway}}}
            - {name: VS_ORCHESTRATOR_URL, value: "https://orchestrator:8443"}
          volumeMounts: &gateway-mounts
            - {name: tls, mountPath: /run/viewsense/tls, readOnly: true}
            - {name: identity-public, mountPath: /run/viewsense/identity, readOnly: true}
          readinessProbe: {tcpSocket: {port: https}, initialDelaySeconds: 2, periodSeconds: 3}
          livenessProbe: {tcpSocket: {port: https}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
      volumes: &gateway-volumes
        - {name: tls, secret: {secretName: tls-gateway, defaultMode: 0444}}
        - {name: identity-public, secret: {secretName: identity-public, defaultMode: 0444}}
---
