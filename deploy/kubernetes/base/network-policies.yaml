apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-all}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: identity-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: identity}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/part-of: viewsense}}
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gateway-policy}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: gateway}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/part-of: viewsense}}
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: identity}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: orchestrator}}
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: orchestrator-policy}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: orchestrator}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: gateway}}}]
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: identity}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: llm-gateway}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: memory-gateway}}
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: governance-policy}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: governance}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: smoke}}}]
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: governance-db}}}]
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: governance-db-policy}
spec:
