apiVersion: v1
kind: ServiceAccount
metadata:
  name: openai-adapter
  labels: {app.kubernetes.io/part-of: viewsense, app.kubernetes.io/managed-by: kustomize}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: openai-adapter
  labels: {app.kubernetes.io/part-of: viewsense, app.kubernetes.io/managed-by: kustomize}
spec:
  selector: {app.kubernetes.io/name: openai-adapter}
  ports: [{name: https, port: 8443, targetPort: https}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openai-adapter
  labels: {app.kubernetes.io/part-of: viewsense, app.kubernetes.io/managed-by: kustomize}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: openai-adapter}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openai-adapter
        app.kubernetes.io/part-of: viewsense
        viewsense.io/plane: llm-provider
    spec:
      serviceAccountName: openai-adapter
      automountServiceAccountToken: false
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: openai-adapter
          image: viewsense-core:dev
          imagePullPolicy: Never
          ports: [{name: https, containerPort: 8443}]
          env:
            - {name: VS_APP_MODULE, value: viewsense_openai_adapter.app}
            - {name: VS_SERVICE_NAME, value: openai-adapter}
            - {name: VS_ENVIRONMENT, value: development}
            - {name: VS_PORT, value: "8443"}
            - {name: VS_IDENTITY_ISSUER, value: "https://identity:8443"}
            - {name: VS_IDENTITY_PUBLIC_KEY_FILE, value: /run/viewsense/identity/signing.pub}
            - {name: VS_TLS_CA_FILE, value: /run/viewsense/tls/ca.crt}
            - {name: VS_TLS_CERT_FILE, value: /run/viewsense/tls/tls.crt}
            - {name: VS_TLS_KEY_FILE, value: /run/viewsense/tls/tls.key}
            - name: VS_OPENAI_API_KEY
              valueFrom: {secretKeyRef: {name: openai-credentials, key: api-key}}
            - name: VS_OPENAI_MODEL
              valueFrom: {secretKeyRef: {name: openai-credentials, key: model}}
          volumeMounts:
            - {name: tls, mountPath: /run/viewsense/tls, readOnly: true}
            - {name: identity-public, mountPath: /run/viewsense/identity, readOnly: true}
          readinessProbe: {tcpSocket: {port: https}, initialDelaySeconds: 2, periodSeconds: 3}
          livenessProbe: {tcpSocket: {port: https}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
      volumes:
        - {name: tls, secret: {secretName: tls-openai-adapter, defaultMode: 0444}}
        - {name: identity-public, secret: {secretName: identity-public, defaultMode: 0444}}
