apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: llm-gateway-openai-egress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: llm-gateway}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: openai-adapter}}}]
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: openai-adapter-policy}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: openai-adapter}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: llm-gateway}}}]
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports: [{protocol: TCP, port: 443}]
