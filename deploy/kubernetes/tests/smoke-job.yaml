apiVersion: batch/v1
kind: Job
metadata:
  name: viewsense-smoke
  namespace: viewsense-dev
  labels:
    app.kubernetes.io/name: smoke
    app.kubernetes.io/part-of: viewsense
    app.kubernetes.io/managed-by: kustomize
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smoke
        app.kubernetes.io/part-of: viewsense
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: smoke
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: smoke
          image: viewsense-core:dev
          imagePullPolicy: Never
          command: [python, -m, viewsense_smoke.main]
          env:
            - {name: VS_IDENTITY_URL, value: "https://identity:8443"}
            - {name: VS_TLS_CA_FILE, value: /run/viewsense/tls/ca.crt}
            - {name: VS_TLS_CERT_FILE, value: /run/viewsense/tls/tls.crt}
            - {name: VS_TLS_KEY_FILE, value: /run/viewsense/tls/tls.key}
            - {name: VS_CLIENT_ID, value: smoke}
            - {name: VS_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: workload-credentials, key: smoke}}}
            - {name: VS_GATEWAY_URL, value: "https://gateway:8443"}
            - {name: VS_INGESTION_URL, value: "https://ingestion:8443"}
            - {name: VS_MEMORY_URL, value: "https://memory-gateway:8443"}
            - {name: VS_MCP_URL, value: "https://mcp-gateway:8443"}
            - {name: VS_GOVERNANCE_URL, value: "https://governance:8443"}
          volumeMounts:
            - {name: tls, mountPath: /run/viewsense/tls, readOnly: true}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 250m, memory: 192Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
      volumes:
        - {name: tls, secret: {secretName: tls-smoke, defaultMode: 0444}}
