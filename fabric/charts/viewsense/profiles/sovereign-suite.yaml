products:
  memory:
    product: postgres-pgvector
    endpoint: https://memory-postgres:8443
    audience: memory-postgres
  agentRuntime:
    enabled: true
    product: builtin
  policy:
    enabled: true
    product: opa-sidecar
    endpoint: http://127.0.0.1:8181/v1/data/viewsense/provider/admit
  workloadIdentity:
    # Planned intent: the current chart does not mount or consume the Workload API socket.
    product: spire
    spiffe:
      trustDomain: viewsense.local
      socketPath: unix:///spiffe-workload-api/spire-agent.sock
  observability:
    # JSON stdout is collectable now; this endpoint is reserved until native OTLP export ships.
    product: otel-collector
    otlpEndpoint: http://otel-collector.observability.svc:4317
