name: Documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "CLAUDE.md"
      - "README.md"
      - "QUICKSTART.md"
      - "TECHNICAL_README.md"
      - "contracts/**"
      - "deploy/integrations/**"
      - "docs/**"
      - "fabric/**/*.md"
      - "requirements-docs.txt"
      - "scripts/build-docs.sh"
      - "tests/README.md"
      - "zensical.toml"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "CLAUDE.md"
      - "README.md"
      - "QUICKSTART.md"
      - "TECHNICAL_README.md"
      - "contracts/**"
      - "deploy/integrations/**"
      - "docs/**"
      - "fabric/**/*.md"
      - "requirements-docs.txt"
      - "scripts/build-docs.sh"
      - "tests/README.md"
      - "zensical.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install documentation toolchain
        run: python -m pip install --requirement requirements-docs.txt
      - name: Build documentation
        run: bash scripts/build-docs.sh
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
